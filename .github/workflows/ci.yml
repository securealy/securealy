name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Built bins parse
        run: |
          node --check packages/cli/dist/bin.js
          node --check packages/mcp/dist/bin.js
      - name: MCP server answers over stdio
        run: npm run smoke --workspace packages/mcp
      - name: Secret and hostname sweep
        run: node scripts/sweep.mjs
